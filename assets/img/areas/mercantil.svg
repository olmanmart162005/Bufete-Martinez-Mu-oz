<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad-mercantil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1722" />
      <stop offset="60%" stop-color="#1C2B3A" />
      <stop offset="100%" stop-color="#2A3D52" />
    </linearGradient>
    <linearGradient id="goldGrad-mercantil" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9B7835" />
      <stop offset="50%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#DFBE7E" />
    </linearGradient>
    <pattern id="grid-mercantil" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(197, 160, 89, 0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="url(#bgGrad-mercantil)" />
  <rect width="800" height="500" fill="url(#grid-mercantil)" />
  
  <circle cx="700" cy="100" r="180" fill="none" stroke="rgba(197, 160, 89, 0.12)" stroke-width="2" />
  <circle cx="700" cy="100" r="240" fill="none" stroke="rgba(197, 160, 89, 0.06)" stroke-width="1" />
  <line x1="60" y1="360" x2="740" y2="360" stroke="url(#goldGrad-mercantil)" stroke-width="3" opacity="0.85" />
  
  <g transform="translate(60, 110)">
    <rect x="0" y="0" width="80" height="80" rx="8" fill="rgba(197, 160, 89, 0.15)" stroke="url(#goldGrad-mercantil)" stroke-width="2"/>
    <circle cx="40" cy="40" r="22" fill="none" stroke="#C5A059" stroke-width="2"/>
    <line x1="28" y1="40" x2="52" y2="40" stroke="#DFBE7E" stroke-width="3"/>
    <line x1="40" y1="28" x2="40" y2="52" stroke="#DFBE7E" stroke-width="3"/>
  </g>

  <text x="60" y="250" font-family="'Cinzel', Georgia, serif" font-size="34" font-weight="700" fill="#FFFFFF" letter-spacing="1.5">
    DERECHO MERCANTIL
  </text>
  
  <text x="60" y="295" font-family="'Montserrat', sans-serif" font-size="16" font-weight="400" fill="#CBD5E1">
    Constitución de Empresas y Gobierno Corporativo
  </text>

  <text x="60" y="420" font-family="'Cinzel', Georgia, serif" font-size="14" font-weight="600" fill="#C5A059" letter-spacing="2">
    BUFETE JURÍDICO MARTÍNEZ MUÑOZ
  </text>
  
  <text x="740" y="420" text-anchor="end" font-family="'Montserrat', sans-serif" font-size="13" font-weight="500" fill="#94A3B8">
    Asesoría Legal Especializada
  </text>
</svg>
